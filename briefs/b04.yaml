# 任务卡：第 4 周（检索质量）
briefs:
  - day: W04D01
    tasks:
      - i: 0
        why: 向量对编号、专有名词不敏感，关键词正好补这个洞。
        refs: [r-pgvector]
        focus: 看全文检索 tsvector 那一节
        steps:
          - 给片段表加 tsvector 列与 GIN 索引
          - 写一条关键词查询
        practice: 找出向量查不到但关键词能命中的例子
        check:
          - 关键词查询可用
          - 有一个反例
        pitfall: 中文分词没配好，关键词检索几乎无效。

      - i: 1
        why: 两路结果不能简单拼接，要融合排序。
        refs: [r-sai-vectordb]
        steps:
          - 同一问题跑向量、关键词、混合三路
          - 记录三路 top5 的重合率
        practice: 得到三路对比数据
        check:
          - 三路结果都有
          - 能说出差异
        pitfall: 直接拼接会让一路主导，等于没混合。

      - i: 2
        why: 排序融合决定最终质量。
        refs: []
        steps:
          - 用 RRF 按排名倒数加权合并
          - 对比合并前后的 top3
        practice: 合并后的 top3 比单路更相关
        check:
          - 融合实现正确
          - 有对比结论
        pitfall: 融合时丢掉原始分数，会损失区分度。

  - day: W04D02
    tasks:
      - i: 0
        why: 重排是「多花一次模型调用换准确率」，要知道买的是什么。
        refs: [r-sai-rag]
        focus: 看 RAG 后处理与检索增强那一节
        steps:
          - 了解交叉编码器与向量检索的差别
          - 记录一次重排的耗时
        practice: 能说出适用场景
        check:
          - 说清代价
          - 说清收益
        pitfall: 对全库重排，延迟会不可接受。

      - i: 1
        why: 只有对比才知道值不值得。
        refs: []
        steps:
          - 对 top5 做重排，记录顺序变化
          - 对比重排前后的相关性
        practice: 得到一组前后对比
        check:
          - 顺序有变化
          - 能判断变好还是变坏
        pitfall: 只看 top1，忽略整体排序质量。

      - i: 2
        why: 重排模型也有偏好，别默认它更好。
        refs: []
        steps:
          - 用评测集跑一轮重排前后
          - 记录指标变化
        practice: 有量化结论
        check:
          - 指标有对比
          - 结论可复现
        pitfall: 只凭几个样例下结论。

  - day: W04D03
    tasks:
      - i: 0
        why: 用户问法和文档措辞往往对不上，改写能显著提升召回。
        refs: [v-rag-optimize-4step]
        focus: 看查询优化那一节
        steps:
          - 让模型把一个问题改写成 3 个变体
          - 分别检索并合并结果
        practice: 改写后召回变多
        check:
          - 三个变体合理
          - 合并结果去重
        pitfall: 改写跑偏，把用户意图改没了。

      - i: 1
        why: HyDE 是另一种思路，值得对比一次。
        refs: []
        steps:
          - 先生成假答案，再用它去检索
          - 对比直接检索的效果
        practice: 有一组对比
        check:
          - 实现正确
          - 能说出适用场景
        pitfall: 假答案里的错误会带偏检索。

      - i: 2
        why: 不是所有问题都值得改写，要知道什么时候用。
        refs: []
        steps:
          - 记录改写有效的三类问题
          - 记录改写无效的两类
        practice: 得到适用边界
        check:
          - 有正反例
          - 结论具体
        pitfall: 无脑全量改写，延迟翻倍收益不明显。

  - day: W04D04
    tasks:
      - i: 0
        why: 片段怎么放进 Prompt 直接决定答案质量。
        refs: [r-sai-rag]
        steps:
          - 给每个片段加编号和来源
          - 控制总 token 预算
        practice: 组装结果可读且不超预算
        check:
          - 编号与来源都在
          - 预算可控
        pitfall: 片段太长被截断，关键信息刚好被切掉。

      - i: 1
        why: 重复片段会浪费上下文。
        refs: []
        steps:
          - 按内容哈希去重
          - 保留相似度最高的那条
        practice: 去重后片段数下降但覆盖不变
        check:
          - 无重复内容
          - 无信息丢失
        pitfall: 去重太激进，把不同章节的相似句子删掉。

      - i: 2
        why: 长上下文里模型存在位置偏好。
        refs: []
        steps:
          - 对比「按相似度排」与「按文档顺序排」
          - 记录答案差异
        practice: 有对比结论
        check:
          - 两种顺序都测了
          - 结论有依据
        pitfall: 只测一个问题就下结论。

  - day: W04D05
    tasks:
      - i: 0
        why: 会引用才不会被当成胡说。
        refs: [r-sai-rag]
        steps:
          - 在 Prompt 里要求用 [1][2] 标注来源
          - 解析答案并校验编号存在
        practice: 答案能指回具体片段
        check:
          - 引用编号有效
          - 无凭空编号
        pitfall: 模型编造不存在的编号，要做存在性校验。

      - i: 1
        why: 敢说不知道，比编一个更像的答案更重要。
        refs: []
        steps:
          - 加拒答条件：检索为空或相似度低于阈值
          - 构造 3 个资料里没有的问题
        practice: 三个问题都拒答
        check:
          - 拒答触发
          - 提示语可读
        pitfall: 阈值定太低，等于不拒答。

      - i: 2
        why: 拒答率是产品指标，不是越低越好。
        refs: []
        steps:
          - 统计 20 个问题里的拒答数
          - 区分「该拒」和「误拒」
        practice: 有误拒率
        check:
          - 两类分开统计
          - 有改进方向
        pitfall: 只盯拒答率降低，忽略误答。

  - day: W04D06
    tasks:
      - i: 0
        why: 归因决定改哪一层，否则只能瞎调。
        refs: [r-ragas]
        steps:
          - 收集 10 个失败案例
          - 按三类标注：检索不到 / 检索到没用 / 生成不忠实
        practice: 得到归因表
        check:
          - 每例有类别
          - 类别判断有依据
        pitfall: 全部归到「模型不行」，无法行动。

      - i: 1
        why: 每类失败对应不同修法。
        refs: []
        steps:
          - 每类写 2 条修复手段
          - 标注成本与预期收益
        practice: 修复清单
        check:
          - 手段具体
          - 有优先级
        pitfall: 用「换更大的模型」解决检索问题。

      - i: 2
        why: 知道哪类占比最高，才知道先修什么。
        refs: []
        steps:
          - 统计三类占比
          - 选占比最高的那类先改
        practice: 一个明确结论
        check:
          - 有数字
          - 有下一步
        pitfall: 三类平均用力，哪类都没改好。

  - day: W04D07
    tasks:
      - i: 0
        why: 清欠账比加新功能重要。
        refs: []
        steps:
          - 列出本周未完成项
          - 逐条决定补或放弃
        practice: 清单清零
        check:
          - 每项有结论
          - 不留下悬空
        pitfall: 全部标成「下周补」，等于没处理。

      - i: 1
        why: 疑点不清会越积越多。
        refs: []
        steps:
          - 把已解决的写上答案
          - 把解决不了的标为放弃
        practice: 疑点清单更新
        check:
          - 无「未解决且无动作」
          - 放弃的写了原因
        pitfall: 只改状态不写结论。

      - i: 2
        why: 带着假设进下一周，学习才有方向。
        refs: []
        steps:
          - 写一个可验证的假设
          - 写下验证方式
        practice: 一条假设 + 一条验证
        check:
          - 假设可证伪
          - 验证可执行
        pitfall: 假设写成愿望。
