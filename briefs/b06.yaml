# 第 7-8 周：完整卡；第 9-10 周：轻量卡
briefs:
  - day: W07D01
    tasks:
      - i: 0
        why: 记忆分层不清，会把聊天记录和用户偏好混成一锅。
        refs: [r-sai-memory]
        focus: 看 ChatMemory 与窗口策略
        steps:
          - 实现会话记忆，对比窗口 10 与 30 的差异
          - 单独存一份用户偏好（3-5 个字段）
          - 写笔记：哪些信息该记、哪些必须忘
        practice: 两种记忆同时工作
        check:
          - 会话内记得住
          - 跨会话记得偏好
        pitfall: 把全部历史写进长期记忆，越用越乱且无法删除。

  - day: W07D02
    tasks:
      - i: 0
        why: 两种规划范式各有代价，面试和设计都要能说清。
        refs: [r-anthropic-agents]
        focus: 看 workflow 与 agent 的对比那节
        steps:
          - 实现 ReAct 循环（限最大步数）
          - 实现先出计划再执行（允许中途改计划）
          - 同一任务对比步数与成功率
        practice: 两版都有可运行实现
        check:
          - 循环能终止
          - 计划可修改
        pitfall: 计划生成后从不更新，执行到一半就失效。

  - day: W07D03
    tasks:
      - i: 0
        why: 能调工具之后，权限就是系统的安全边界。
        refs: [r-owasp-llm]
        focus: 看 Excessive Agency 一类
        steps:
          - 给工具加入参校验与白名单
          - 危险动作（退款/删除）要求二次确认
          - 用 3 个畸形参数攻击自己
        practice: 攻击全部被拦住
        check:
          - 越权被拒
          - 有审计日志
        pitfall: 只靠 Prompt 约束权限，模型被诱导就失效。

  - day: W07D04
    tasks:
      - i: 0
        why: 没有分步记录，出错只能猜。
        refs: [r-otel-genai]
        focus: 看 LLM span 属性约定
        steps:
          - 每步记录输入、输出、耗时、状态
          - 人为制造一次失败，只靠日志定位
          - 写成三步排查 SOP
        practice: 一次完整定位演练
        check:
          - 能定位到具体步骤
          - SOP 别人能照着用
        pitfall: 只记最终答案，中间过程全丢。

  - day: W07D05
    tasks:
      - i: 0
        why: 幻觉消灭不了，只能收敛到可接受。
        refs: [r-sai-rag, v-prompt-agent-mcp-10min]
        focus: 看引用与拒答的做法
        steps:
          - 事实类问题先查工具或检索
          - 答案带引用编号
          - 低置信度直接拒答
        practice: 用 5 个无依据问题验证
        check:
          - 引用可核对
          - 该拒就拒
        pitfall: 把拒答率压到 0，等于把幻觉送出去。

  - day: W07D06
    tasks:
      - i: 0
        why: 不知道钱花在哪，优化就是盲调。
        refs: [v-kvcache-promptcache]
        focus: 8 分钟，讲缓存命中
        steps:
          - 统计每次请求 token、费用、耗时
          - 试一次模型路由：简单问题走小模型
          - 试缓存命中率
        practice: 一张成本分布小表
        check:
          - 有细分数据
          - 有降本尝试与效果
        pitfall: 只算成功请求，忽略重试与失败的开销。

  - day: W07D07
    tasks:
      - i: 0
        why: 自评能定位最弱的一环，比感觉可靠。
        refs: []
        steps:
          - 按超时/重试/权限/日志/成本各打 1-5 分
          - 标出最弱项并写一条改进
        practice: 一张自评表
        check:
          - 五项都有分
          - 最弱项有动作
        pitfall: 全部打高分，自评就失去意义。

  - day: W08D01
    tasks:
      - i: 0
        why: 并发不是把线程开大，而是把压力控住。
        refs: [v-threadpool]
        focus: 看线程池参数怎么配合
        steps:
          - 用信号量限制并发模型请求数
          - 压测 20 并发，记录 P95 与错误率
          - 加排队与拒绝策略
        practice: 一份压测数据
        check:
          - 限流生效
          - 有 P95 数字
        pitfall: 只调大线程数不设限，直接把下游打挂。

  - day: W08D02
    tasks:
      - i: 0
        why: 下游挂了，你的服务不能跟着挂。
        refs: [r-resilience4j]
        focus: 看 CircuitBreaker 状态机
        steps:
          - 配失败率阈值与半开探测
          - 实现降级：缓存答案或友好提示
          - 人为关掉模型服务验证
        practice: 验证记录
        check:
          - 熔断生效
          - 降级文案可用
        pitfall: 降级后仍然无限重试，等于没降级。

  - day: W08D03
    tasks:
      - i: 0
        why: Prompt 是核心逻辑，必须能回滚与对比。
        refs: [v-ng-prompt]
        focus: 看版本管理思路
        steps:
          - 抽到外部模板，加版本号
          - 建变更记录：改了什么、为什么、指标变化
          - 支持按版本切换
        practice: 能切回上一版
        check:
          - 版本可切换
          - 有变更记录
        pitfall: 没有版本，效果变差时无法定位是哪次改动。

  - day: W08D04
    tasks:
      - i: 0
        why: 效果回归要像编译失败一样被拦住。
        refs: [v-ragas]
        focus: 看自动化评测脚本
        steps:
          - 评测脚本接 CI
          - 设阈值，低于基线就失败
          - 故意改坏 Prompt 验证能拦住
        practice: CI 能跑并失败一次
        check:
          - CI 触发正常
          - 阈值生效
        pitfall: 阈值随意调低，CI 变成摆设。

  - day: W08D05
    tasks:
      - i: 0
        why: 别人 clone 后一条命令能起来，才算交付。
        refs: [v-docker-40min]
        focus: 只看 Dockerfile 与 compose
        steps:
          - 写多阶段构建的 Dockerfile
          - compose 起 app + pgvector，配健康检查
          - 干净环境验证启动
        practice: 一条命令起服务
        check:
          - 启动成功
          - 健康检查通过
        pitfall: 容器里写死密钥与本地路径。

  - day: W08D06
    tasks:
      - i: 0
        why: 能演示失败路径，才说明系统可靠。
        refs: [v-hm-rag-agent-project]
        focus: 只看目录结构与 README
        steps:
          - 准备三条演示线：成功、失败兜底、越权被拦
          - 找人照 README 跑一遍并记录卡点
        practice: 他人验证记录
        check:
          - 三条都能演示
          - 有人独立跑通
        pitfall: 只演示成功路径，问题被藏起来。

  - day: W08D07
    tasks:
      - i: 0
        why: 复盘的产出是风险清单，不是感想。
        refs: []
        steps:
          - 列「不敢上线的 5 个理由」
          - 按影响与发生概率排序
        practice: 一份排序后的清单
        check:
          - 五条都具体
          - 有排序依据
        pitfall: 写成「还不够好」这种模糊理由。

  - day: W09D01
    tasks:
      - i: 0
        why: 日志格式乱，出事时只能靠人眼扫。
        refs: [v-otel-itlaoqi]
        focus: 看结构化日志那节
        steps:
          - 统一成 JSON 行：时间、级别、traceId、事件、耗时
          - 约定三类事件名：llm.call、tool.call、rag.retrieve
          - 做脱敏：手机号、密钥不进日志
        practice: 三类事件各打一条日志
        check:
          - 字段齐全
          - 敏感字段已脱敏
        pitfall: 把用户原文整段打进日志，等于把隐私写进磁盘。

  - day: W09D02
    tasks:
      - i: 0
        why: 平均值会掩盖长尾，用户体感看的是 P95。
        refs: [v-otel-springboot, r-spring-boot-actuator]
        focus: 看指标暴露与 Actuator 端点
        steps:
          - 暴露 /actuator/metrics 与 health
          - 自定义四个指标：token、模型调用次数、失败率、工具耗时
          - 看一次 P95 与平均值差多少
        practice: 能在页面上看到这四类指标
        check:
          - 端点可访问
          - 有分位数数据
        pitfall: 只记调用次数不记耗时分布，长尾问题永远发现不了。

  - day: W09D03
    tasks:
      - i: 0
        why: 一次请求跨三步，没有 trace 就只能猜是哪一步慢。
        refs: [v-otel-itlaoqi, r-otel-genai]
        focus: 看 trace 三段划分
        steps:
          - 检索、组装、生成各加一个 span
          - span 带上模型名、token 数、耗时
          - 跑一次完整请求，看三段耗时占比
        practice: 一条完整 trace
        check:
          - 三个 span 都在
          - 能找到最慢的一段
        pitfall: span 属性里塞了用户隐私字段。

  - day: W09D04
    tasks:
      - i: 0
        why: 框架自动埋点覆盖不到业务维度，要自己补。
        refs: [v-otel-springboot]
        focus: 看接入示例
        steps:
          - 开 Spring AI observability
          - 对比自动 span 与手写 span 缺什么
          - 补上业务维度（功能名、租户）
        practice: 自动 + 手工各一条，能看到差异
        check:
          - 自动埋点生效
          - 业务字段补上
        pitfall: 以为开了自动埋点就万事大吉，业务问题仍然定位不到。

  - day: W09D05
    tasks:
      - i: 0
        why: 演练能提前发现「日志记了但没用」。
        refs: [v-otel-itlaoqi]
        focus: 演练前再看一遍链路部分
        steps:
          - 注入三种故障：检索空、工具超时、非法 JSON
          - 只看日志和 trace 逐个定位
          - 写一页排障手册
        practice: 三次演练都有记录
        check:
          - 三种都能定位
          - 手册可复用
        pitfall: 演练时偷偷看代码，等于没演练。

  - day: W09D06
    tasks:
      - i: 0
        why: 不知道钱花在哪，降本就是拍脑袋。
        refs: [v-kvcache-promptcache]
        focus: 成本相关部分
        steps:
          - 按天与功能统计 token 与费用
          - 找出最贵的三个请求类型
        practice: 一张成本分布表
        check:
          - 有细分维度
          - 能指出最贵的一类
        pitfall: 只算成功请求，漏掉重试与失败的开销。

  - day: W10D01
    tasks:
      - i: 0
        why: 先建风险地图，再谈具体防御。
        refs: [v-llm-security, r-owasp-llm]
        focus: 看 Top10 里与你项目最相关的三类
        steps:
          - 逐条写「在我项目里长什么样」
          - 标出最相关三类，其余记为暂不适用
        practice: 一张风险登记表
        check:
          - 三类具体到场景
          - 不适用的也写了
        pitfall: 十类全部抄一遍，等于没做判断。

  - day: W10D02
    tasks:
      - i: 0
        why: 亲手打一次自己的系统，才知道防没防住。
        refs: [v-llm-security]
        focus: 看注入攻击的演示部分
        steps:
          - 直接注入：让它泄露系统提示词
          - 间接注入：在检索文档里埋一句指令
          - 记录 5 个攻击用例的实际表现
        practice: 5 条用例 + 结果
        check:
          - 直接与间接各测过
          - 有失败用例
        pitfall: 只测直接注入，忽略检索内容里的间接注入。

  - day: W10D03
    tasks:
      - i: 0
        why: 护栏要在模型前后各设一道。
        refs: [v-llm-security]
        focus: 看护栏与校验的做法
        steps:
          - 输入侧：长度、敏感词、注入特征
          - 输出侧：敏感信息、格式、引用存在性
        practice: 两条护栏都生效
        check:
          - 输入被拦
          - 输出被校验
        pitfall: 护栏太严会误杀正常请求，阈值要有依据。

  - day: W10D04
    tasks:
      - i: 0
        why: 能调工具之后，审计是唯一的追溯手段。
        refs: [v-fc-vs-mcp]
        focus: 看工具权限与执行边界
        steps:
          - 按角色分配可用工具
          - 危险操作走确认或审批
          - 记录：谁、何时、调了什么、参数、结果
        practice: 一条完整审计记录
        check:
          - 权限矩阵可查
          - 审计能还原全过程
        pitfall: 审计日志本身含敏感信息，却没做访问控制。

  - day: W10D05
    tasks:
      - i: 0
        why: 先分类，再谈脱敏与隔离。
        refs: [r-owasp-llm]
        focus: 看数据泄露与隐私相关条目
        steps:
          - 列出绝对不能进 Prompt 的数据
          - 做脱敏规则并验证
          - 检查 Git 历史里有没有泄露密钥
        practice: 数据分级清单
        check:
          - 分级明确
          - 脱敏生效
        pitfall: 只删了代码里的密钥，历史提交里还在。

  - day: W10D06
    tasks:
      - i: 0
        why: 把「知道的风险」变成可勾选的状态。
        refs: [r-owasp-llm]
        focus: 对照自查表逐条过
        steps:
          - 写 20 项自查（注入/权限/脱敏/日志/成本/依赖）
          - 逐项标注：已做 / 部分 / 未做 / 不适用
          - 未做的挑 3 项本周补
        practice: 20 项自查表
        check:
          - 每项有状态
          - 有补救计划
        pitfall: 全部标「已做」，自查变成形式。
