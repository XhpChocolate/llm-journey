        refs: [v-otel-itlaoqi]
        focus: 演练前再看一遍链路部分
  - day: W09D06
    tasks:
      - i: 0
        refs: [v-kvcache-promptcache]
        focus: 成本相关部分

  - day: W10D01
    tasks:
      - i: 0
        refs: [v-llm-security, r-owasp-llm]
        focus: 看 Top10 里与你项目最相关的三类
  - day: W10D02
    tasks:
      - i: 0
        refs: [v-llm-security]
        focus: 看注入攻击的演示部分
  - day: W10D03
    tasks:
      - i: 0
        refs: [v-llm-security]
        focus: 看护栏与校验的做法
  - day: W10D04
    tasks:
      - i: 0
        refs: [v-fc-vs-mcp]
