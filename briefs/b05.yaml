# 完整任务卡：第 5-6 周（从轻量卡升级）
briefs:
  - day: W05D01
    tasks:
      - i: 0
        why: 不懂指标含义，评测分数就是一堆看不懂的数字。
        refs: [r-ragas]
        focus: 看 Metrics 一节，认四个指标就够
        steps:
          - 列出 faithfulness、answer relevancy、context precision、context recall
          - 每个指标写一句「它在衡量什么」
          - 标出哪两个是检索指标、哪两个是生成指标
        practice: 做一张四行指标卡
        check:
          - 四个指标都有一句话解释
          - 能区分检索与生成
        pitfall: 把 context recall 当成答案质量，其实它衡量检索有没有漏。

      - i: 1
        why: 面试常问「怎么评估 RAG」，先有个标准答案。
        refs: [v-rag-eval-interview]
        focus: 12 分钟，当面试题听
        steps:
          - 听一遍，记下对方的三段结构
          - 用自己的项目替换例子复述一次
        practice: 录一段 90 秒的回答
        check:
          - 能说出三类指标
          - 有自己的数据支撑
        pitfall: 只背指标名，说不出为什么需要评测集。

  - day: W05D02
    tasks:
      - i: 0
        why: 评测集是资产，凑数会得出错误结论。
        refs: [r-ragas]
        focus: 看评测集构造示例
        steps:
          - 写 20 条：问题 + 标准要点 + 出处
          - 覆盖三类：事实查找、多跳、应拒答
        practice: 存成 YAML 并纳入 Git
        check:
          - 三类都有
          - 每条有出处
        pitfall: 全是「文档里能直接抄到答案」的题，会高估效果。

  - day: W05D03
    tasks:
      - i: 0
        why: 手工看 20 条答案不可持续，必须自动化。
        refs: [v-ragas]
        focus: 跟着敲一遍，别只看
        steps:
          - 写脚本读评测集、调接口、收集答案
          - 用规则或 LLM 打分，输出 CSV
          - 结果带时间戳存档
        practice: 一条命令跑出报告
        check:
          - 能重复跑
          - 报告能对比两次
        pitfall: 分数不存档，改完就不知道有没有变好。

  - day: W05D04
    tasks:
      - i: 0
        why: 一次只改一个变量，才能知道是谁的功劳。
        refs: [r-ragas]
        focus: 看对比实验的写法
        steps:
          - 只改 topK（3→8），跑评测
          - 对比两份报告的分项
        practice: 写结论：涨了多少、代价是什么
        check:
          - 只有一个变量
          - 有代价说明
        pitfall: 同时改切片和 topK，结论无法归因。

  - day: W05D05
    tasks:
      - i: 0
        why: 固定流水线有天花板，先知道上限在哪。
        refs: [r-anthropic-agents, v-agent-principles]
        focus: 只看 workflow 与 agent 的区分那节
        steps:
          - 实现一版：模型先判断要不要检索
          - 用 5 个问题对比固定 RAG
        practice: 有对比结论
        check:
          - 决策点实现正确
          - 能说出代价
        pitfall: 简单问题也走 Agent，延迟翻倍收益为零。

  - day: W05D06
    tasks:
      - i: 0
        why: 作品的标准是别人能跑起来，不是自己电脑能跑。
        refs: [v-turing-rag-project]
        focus: 只看项目结构，不必跟着写
        steps:
          - 整理成上传→解析→入库→问答四步
          - README 写清启动与评测结果
        practice: 找一个同事照着跑一遍
        check:
          - 别人能跑通
          - 卡点已写进 README
        pitfall: 只在自己环境验证，换个机器就缺依赖。

  - day: W05D07
    tasks:
      - i: 0
        why: 不清欠账会带进下一阶段。
        refs: []
        focus: 归档前先跑一次基线
        steps:
          - 归档评测报告与配置快照
          - 列出仍未解决的 3 个问题
        practice: 阶段小结一页
        check:
          - 基线可复现
          - 遗留问题写清
        pitfall: 只记结论不记配置，下次无法复现。

  - day: W06D01
    tasks:
      - i: 0
        why: 分不清 workflow 和 agent，就会把简单任务做成复杂系统。
        refs: [r-anthropic-agents, v-agent-principles]
        focus: 画循环图那节
        steps:
          - 画 think→act→observe→think 循环
          - 列 3 个「用 agent 反而更糟」的场景
        practice: 一张循环图 + 判定清单
        check:
          - 循环四步正确
          - 清单能指导选型
        pitfall: 以为用 agent 就更高级，其实多数任务该用固定流程。

      - i: 1
        why: 自己实现一遍，才知道框架帮你处理了什么。
        refs: [v-agent-principles]
        focus: 看简化循环的实现
        steps:
          - 手写一个循环：调模型→判断是否调工具→执行→回填
          - 加最大步数上限
        practice: 能跑通一次工具调用闭环
        check:
          - 循环能终止
          - 有步数上限
        pitfall: 没有上限的循环会一直烧 token。

  - day: W06D02
    tasks:
      - i: 0
        why: 工具描述就是给模型看的说明书，写得含糊它就乱猜。
        refs: [r-sai-tools]
        focus: 看工具描述与参数 schema
        steps:
          - 写清楚名称、描述、参数类型与枚举
          - 对比模糊描述与精确描述的调用成功率
        practice: 得到两组对比数据
        check:
          - 描述含使用场景
          - 参数有类型约束
        pitfall: 把参数全写成 string，模型会传任意内容。

      - i: 1
        why: 错误信息要能让模型自我修正。
        refs: [r-sai-tools]
        focus: 看错误返回约定
        steps:
          - 定义错误结构：code、message、可重试标记
          - 让工具失败时返回结构化错误而不是抛异常
        practice: 模型能基于错误换参数重试
        check:
          - 错误可读
          - 能触发重试
        pitfall: 直接抛异常，模型只会重复同样的错误调用。

  - day: W06D03
    tasks:
      - i: 0
        why: 第一个能自己查数据的 Agent，是整条链路的最小可行证明。
        refs: [r-sai-tools]
        focus: 看 @Tool 的最小示例
        steps:
          - 用 H2 造 20 条订单数据
          - 实现 queryOrder 工具并注册
          - 让模型回答「订单 1001 到哪了」
        practice: 完成一次真实查询闭环
        check:
          - 模型自动调工具
          - 答案基于工具返回
        pitfall: 工具返回整张表，模型会被数据淹掉，只返回需要的字段。

  - day: W06D04
    tasks:
      - i: 0
        why: 工具越多选错概率越高，要亲手看到这个拐点。
        refs: [v-fc-vs-mcp]
        focus: 看工具选择与路由那部分
        steps:
          - 增加到 4 个语义相近的工具
          - 用 10 个问题测选择准确率
        practice: 记录选错的具体表现
        check:
          - 有准确率数字
          - 能说出混淆原因
        pitfall: 工具描述之间没有区分度，模型只能靠猜。

  - day: W06D05
    tasks:
      - i: 0
        why: 亲手制造一次 token 爆炸，才会认真做裁剪。
        refs: [r-sai-memory]
        focus: 看 ChatMemory 的几种策略
        steps:
          - 跑 20 轮对话，记录每轮 token
          - 实现滑动窗口与摘要两种裁剪
        practice: 得到 token 增长曲线
        check:
          - 曲线能看出增长
          - 两种裁剪都生效
        pitfall: 摘要丢掉了早期关键约束，回答开始跑偏。

  - day: W06D06
    tasks:
      - i: 0
        why: 重试非幂等操作会造成重复下单这类事故。
        refs: [r-resilience4j]
        focus: 看 Retry 与 TimeLimiter
        steps:
          - 给模型调用加指数退避（只重试可重试错误）
          - 给工具调用加超时与兜底
          - 检查写操作是否幂等
        practice: 三种失败场景各测一次
        check:
          - 4xx 不重试
          - 写操作有幂等键
        pitfall: 对所有错误无脑重试，放大故障。

  - day: W06D07
    tasks:
      - i: 0
        why: 不复盘的周会把同样的坑带到下周。
        refs: []
        steps:
          - 写本周完成率与最大卡点
          - 更新疑点清单
        practice: 周复盘一页
        check:
          - 有数据
          - 有下周动作
        pitfall: 只写完成了什么，下周不会有改变。

  - day: W07D01
    tasks:
      - i: 0
        why: 记忆分层不清楚，就会把用户偏好和聊天记录混在一起。
        refs: [r-sai-memory]
        focus: 看 ChatMemory 与窗口策略
        steps:
          - 实现会话记忆，对比窗口大小影响
          - 单独存一份用户偏好（少量字段）
        practice: 两种记忆能同时工作
        check:
          - 会话内记得住
          - 跨会话记得偏好
        pitfall: 把全部历史写进长期记忆，越用越乱。

  - day: W07D02
    tasks:
      - i: 0
        why: 两种规划范式各有代价，要知道什么时候用哪个。
        refs: [r-anthropic-agents]
        focus: 看 workflow 与 agent 的对比那节
        steps:
          - 实现 ReAct 循环（限步数）
          - 实现先出计划再执行
        practice: 同一任务对比步数与成功率
        check:
          - 两版都能跑
          - 有对比数据
        pitfall: 计划生成后不更新，执行到一半就失效。

  - day: W07D03
    tasks:
      - i: 0
        why: Agent 能调工具之后，权限就是安全边界。
        refs: [r-owasp-llm]
        focus: 看 Excessive Agency 一类
        steps:
          - 给工具加入参校验与白名单
          - 危险动作要求二次确认
        practice: 用越权参数攻击一次
        check:
          - 越权被拦住
          - 有审计记录
        pitfall: 靠 Prompt 约束权限，等于没约束。

  - day: W07D04
    tasks:
      - i: 0
        why: 没有分步记录，出错只能猜。
        refs: [r-otel-genai]
        focus: 看 LLM span 属性
        steps:
          - 每步记录输入、输出、耗时
          - 人为制造一次失败，只用日志定位
        practice: 写一份三步排查 SOP
        check:
          - 能定位到具体步骤
          - SOP 可复用
        pitfall: 只记最终答案，中间过程全丢。

  - day: W07D05
    tasks:
      - i: 0
        why: 幻觉不能消灭，只能收敛。
        refs: [r-sai-rag]
        focus: 看引用与拒答的做法
        steps:
          - 工具优先取事实
          - 答案带引用
          - 低置信度直接拒答
        practice: 用 5 个无依据问题验证拒答
        check:
          - 引用可核对
          - 该拒就拒
        pitfall: 拒答率压得太低，等于把幻觉送出去。

  - day: W07D06
    tasks:
      - i: 0
        why: 不知道钱花在哪，就无法优化。
        refs: [v-kvcache-promptcache]
        focus: 8 分钟，讲缓存命中
        steps:
          - 统计每次请求的 token 与费用
          - 试一次模型路由（简单问题走小模型）
        practice: 得到成本分布
        check:
          - 有细分数据
          - 有降本尝试
        pitfall: 只统计成功请求，忽略失败与重试的开销。

  - day: W07D07
    tasks:
      - i: 0
        why: 自评能找出最弱的一环。
        refs: []
        steps:
          - 按超时/重试/权限/日志/成本各打 1-5 分
          - 标出最弱项
        practice: 一张自评表
        check:
          - 五项都有分
          - 最弱项有改进计划
        pitfall: 全部打高分，自评失去意义。

  - day: W08D01
    tasks:
      - i: 0
        why: 并发不是把线程开大，而是把压力控住。
        refs: [v-threadpool]
        focus: 看线程池参数配合
        steps:
          - 用信号量限制并发模型请求
          - 压测 20 并发，记录 P95 与错误率
        practice: 有压测数据
        check:
          - 限流生效
          - 有 P95 数字
        pitfall: 只加线程不设上限，直接把下游打挂。

  - day: W08D02
    tasks:
      - i: 0
        why: 下游挂了，你的服务不能跟着挂。
        refs: [r-resilience4j]
        focus: 看 CircuitBreaker 状态机
        steps:
          - 配熔断阈值与半开探测
          - 实现降级（缓存或友好提示）
        practice: 人为关掉模型服务验证
        check:
          - 熔断生效
          - 降级文案可用
        pitfall: 降级后仍然无限重试，等于没降级。

  - day: W08D03
    tasks:
      - i: 0
        why: Prompt 是核心逻辑，必须能回滚。
        refs: [v-ng-prompt]
        focus: 看版本管理思路
        steps:
          - 抽到外部模板文件，加版本号
          - 建变更记录（改了什么、为什么、指标变化）
        practice: 能按版本切换
        check:
          - 版本可切换
          - 有变更记录
        pitfall: 没有版本，效果变差时无法定位。

  - day: W08D04
    tasks:
      - i: 0
        why: 效果回归要像编译失败一样被拦住。
        refs: [v-ragas]
        focus: 看自动化评测脚本
        steps:
          - 评测脚本接 CI
          - 设阈值，低于基线就失败
        practice: 故意改坏 Prompt，确认 CI 拦住
        check:
          - CI 能跑
          - 阈值生效
        pitfall: 阈值随意调低，CI 变成摆设。

  - day: W08D05
    tasks:
      - i: 0
        why: 别人 clone 之后一条命令能起来，才算交付。
        refs: [v-docker-40min]
        focus: 只看 Dockerfile 与 compose
        steps:
          - 写 Dockerfile（多阶段构建）
          - compose 起 app + pgvector，配健康检查
        practice: 干净环境验证启动
        check:
          - 一条命令起服务
          - 健康检查通过
        pitfall: 容器里写死密钥与本地路径。

  - day: W08D06
    tasks:
      - i: 0
        why: 能演示失败路径，才说明系统可靠。
        refs: [v-hm-rag-agent-project]
        focus: 只看目录结构与 README
        steps:
          - 准备三条演示线：成功、失败兜底、越权被拦
          - 找人照 README 跑一遍
        practice: 记录对方卡点
        check:
          - 三条线都能演示
          - 有人验证过
        pitfall: 只演示成功路径，问题被藏起来。

  - day: W08D07
    tasks:
      - i: 0
        why: 阶段复盘的产出是风险清单，不是感想。
        refs: []
        steps:
          - 列「不敢上线的 5 个理由」
          - 按影响与概率排序
        practice: 得到优先级
        check:
          - 五条具体
          - 有排序依据
        pitfall: 全写成「还不够好」这种模糊理由。
