# 第 11-14 周：完整卡（收尾）
briefs:
  - day: W11D01
    tasks:
      - i: 0
        why: 不懂 host/client/server 的关系，接进去就是一堆玄学问题。
        refs: [v-mcp-ultimate, r-mcp-spec-zh]
        focus: 先看 27 分钟原理，再读中文规范
        steps:
          - 画出 host、client、server 三者关系
          - 列出 tools、resources、prompts 三种能力
          - 写一句「没有 MCP 时会怎样」的对比
        practice: 一张关系图 + 三种能力说明
        check:
          - 三者关系正确
          - 三种能力各举一例
        pitfall: 把 MCP 当成「又一个 Function Calling」，看不出它的治理价值。

  - day: W11D02
    tasks:
      - i: 0
        why: 亲手把一段 Java 逻辑变成工具，才算真的会用。
        refs: [v-sgg-mcp, r-mcp-tutorial-zh]
        focus: 跟着写最小 Server，别只看
        steps:
          - 用 Java SDK 起一个 Server
          - 暴露 queryOrder 工具（复用第 6 周数据）
          - 用 Client 列出工具并调通一次
        practice: Server 能被客户端调用
        check:
          - 工具清单可见
          - 能返回真实数据
        pitfall: stdio 模式把日志打到 stdout，协议直接坏掉。

  - day: W11D03
    tasks:
      - i: 0
        why: 在熟悉的框架里做，才能带进生产。
        refs: [v-sgg-mcp]
        focus: 看 Spring AI 集成那几集
        steps:
          - 用 Spring AI 的 MCP Server 支持声明工具
          - 配置传输方式与暴露范围
          - 用客户端连上验证
        practice: 注解版工具能调通
        check:
          - 工具暴露正确
          - 传输方式可切换
        pitfall: 暴露范围写成全量，把内部接口也漏出去。

  - day: W11D04
    tasks:
      - i: 0
        why: 打通 Agent → MCP → 业务系统，这条链才是真正的价值。
        refs: [v-sgg-mcp, r-sai-mcp]
        focus: 看 Client 端如何发现工具
        steps:
          - 让第 8 周的 Agent 通过 MCP 发现工具
          - 验证工具描述来自 Server 而不是硬编码
          - 记录一次完整调用的耗时分布
        practice: 端到端跑通一次
        check:
          - 工具动态发现
          - 有耗时记录
        pitfall: 工具名冲突时没有命名空间，模型会选错。

  - day: W11D05
    tasks:
      - i: 0
        why: 协议不负责治理，鉴权和审计必须自己加。
        refs: [r-mcp-spec-zh]
        focus: 看鉴权与传输那节
        steps:
          - 给 Server 加调用方鉴权
          - 按租户与工具加限流配额
          - 记录审计：谁、何时、调了什么、返回多少行
        practice: 三种治理都生效
        check:
          - 越权调用被拒
          - 审计可回放
        pitfall: 内部系统不做行级权限，一个查询能拿全表。

  - day: W11D06
    tasks:
      - i: 0
        why: 选型结论要能对团队讲清，而不只是自己觉得。
        refs: [v-mcp-vs-fc, v-fc-vs-mcp]
        focus: 两个视频对照看，形成自己的结论
        steps:
          - 做对比表：开发成本、复用性、治理、部署、调试
          - 写 200 字选型建议
        practice: 一段可以直接讲的结论
        check:
          - 五个维度都有对比
          - 有明确适用边界
        pitfall: 结论只有「MCP 更先进」，没有成本分析。

  - day: W12D01
    tasks:
      - i: 0
        why: 看图的 60 秒决定别人要不要继续看。
        refs: [v-hm-rag-agent-project]
        focus: 参考别人的 README 结构
        steps:
          - 画架构图：组件、数据流、外部依赖
          - README 写背景、方案、取舍、指标、限制
          - 补一节「为什么不选另一个方案」
        practice: 60 秒能讲清项目
        check:
          - 图上一眼看到数据流
          - 有取舍说明
        pitfall: 架构图堆满类名，看不出重点。

  - day: W12D02
    tasks:
      - i: 0
        why: 分层不是为了好看，是为了换模型时不改业务代码。
        refs: [v-hm-rag-agent-project]
        focus: 看分层与包结构
        steps:
          - 按 api / application / domain / infrastructure 分包
          - 配置全部外置，去掉魔法值
          - 统一异常与返回结构
        practice: 新人加一个工具只需改两处
        check:
          - 依赖方向清晰
          - 无硬编码配置
        pitfall: 业务层直接 import 具体模型 SDK，换模型就重写。

  - day: W12D03
    tasks:
      - i: 0
        why: 关键路径没测试，改代码全靠祈祷。
        refs: [v-ragas, r-ragas]
        focus: 评测脚本与 CI
        steps:
          - 单测覆盖工具实现与参数校验
          - 集成测试覆盖检索→生成主链路
          - 跑一次全量 eval 并把结果写进 README
        practice: 测试全绿 + 评测报告
        check:
          - 关键路径有测试
          - 评测结果可复现
        pitfall: 集成测试直接连真实模型，慢且不稳定。

  - day: W12D04
    tasks:
      - i: 0
        why: 演示失败路径，比展示成功更能说明可靠性。
        refs: [v-hm-rag-agent-project]
        focus: 看别人的演示方式
        steps:
          - 设计三条线：正常问答、失败兜底、越权被拦
          - 录 3 分钟，配脚本或字幕
        practice: 一段能独立播放的演示
        check:
          - 三条线都出现
          - 无需口头补充也能看懂
        pitfall: 全程只演示成功，面试官一问失败就露馅。

  - day: W12D05
    tasks:
      - i: 0
        why: 简历是把技术工作翻译成招聘方看得懂的价值。
        refs: [v-prompt-agent-mcp-10min]
        focus: 用 10 分钟梳理自己的技术地图
        steps:
          - 用 STAR 写一段项目描述
          - 量化三个指标：效果、延迟、成本
          - 列三个技术难点与解法
        practice: 一段可直接粘贴的简历文字
        check:
          - 有数字
          - 有取舍判断
        pitfall: 写成「负责大模型应用开发」，看不出你做了什么。

  - day: W12D06
    tasks:
      - i: 0
        why: 提前暴露知识空洞，比现场尴尬好。
        refs: [r-ragas, r-owasp-llm]
        focus: 按评测与安全两个方向准备追问
        steps:
          - 写 20 个可能的追问
          - 口述并录音，标出卡壳的
          - 补上卡壳的 5 个并写出答案
        practice: 20 问 + 修订答案
        check:
          - 至少能答上 15 个
          - 答不上的能说出会怎么查
        pitfall: 背答案但不理解，追问一层就崩。

  - day: W13D01
    tasks:
      - i: 0
        why: 先盘点再补课，否则永远在补最不重要的。
        refs: [r-lc4j-root]
        focus: 先看框架总览，判断哪块没学会
        steps:
          - 合并疑点清单里的同类项
          - 按「影响作品/影响面试」排序
          - 只选 5 项进本周补课
        practice: 一份排好序的清单
        check:
          - 有排序依据
          - 明确放弃了哪些
        pitfall: 全部都想补，结果一项都没补完。

  - day: W13D02
    tasks:
      - i: 0
        why: 讲不清楚就是没懂。
        refs: [v-otel-yangming]
        focus: 补观测链路那段
        steps:
          - 用费曼法写一页解释，不用术语
          - 找到官方文档依据并标出处
          - 写一个最小可运行验证
        practice: 一页解释 + 能跑的验证
        check:
          - 外行能听懂
          - 有出处
        pitfall: 用术语解释术语，自己以为懂了。

  - day: W13D03
    tasks:
      - i: 0
        why: 能跑但不敢给人看的代码，等于没写。
        refs: [v-hm-springai-deepseek]
        focus: 对照别人的工程化写法
        steps:
          - 挑最丑的一个类重写并说明为什么
          - 补日志、校验、边界处理
          - 加一条注释解释为什么这么写
        practice: 一次可读的重构提交
        check:
          - 职责清晰
          - 有三个月的自己看得懂
        pitfall: 重构时顺手改需求，问题无法定位。

  - day: W13D04
    tasks:
      - i: 0
        why: 一个主用一个对照，才分得清哪些是框架、哪些是本质。
        refs: [v-lc4j-yupi]
        focus: 跟写一遍工具调用 + RAG
        steps:
          - 用 LangChain4j 实现最小版工具调用 + RAG
          - 列 API 对照表：AI Services vs ChatClient
          - 写结论：什么场景会选它
        practice: 最小实现 + 对照表
        check:
          - 能跑通
          - 结论有依据
        pitfall: 两个框架都想深学，结果概念混在一起。

      - i: 2
        why: 看别人怎么组织项目，比背 API 有用。
        refs: [v-lc4j-sgg-medical]
        focus: 只看项目结构，不必全看
        steps:
          - 记下它的分层与模块划分
          - 对比自己的项目缺哪层
        practice: 一条可落地的结构调整
        check:
          - 能说出一个差异
          - 有改进动作
        pitfall: 照抄结构不理解原因，越抄越乱。

  - day: W13D05
    tasks:
      - i: 0
        why: 时间盒能保护整体进度，防止陷进细节。
        refs: [v-hm-springai-deepseek]
        focus: 挑一个薄弱章节补
        steps:
          - 设 90 分钟上限，到点就停
          - 写下「学到什么 + 还差什么」
        practice: 一条落地到项目的动作
        check:
          - 有时间边界
          - 有落点
        pitfall: 补课不落地，下周还得再补一次。

  - day: W13D06
    tasks:
      - i: 0
        why: 诚实写边界，比假装完美更可信。
        refs: [v-lc4j-heima]
        focus: 看 RAG 章节的工程实现
        steps:
          - 写 3 条架构决策记录（选型/取舍/放弃方案）
          - 补「已知限制」一节
          - 重录演示，比上一版更顺
        practice: ADR + 限制说明 + 新演示
        check:
          - 每条 ADR 有理由
          - 限制写得具体
        pitfall: 只记最终方案，不记放弃的方案和原因。

  - day: W14D01
    tasks:
      - i: 0
        why: 知道它解决什么、不解决什么，才不会被当成银弹。
        refs: [v-virtual-thread, r-jep444-zh]
        focus: 先看 33 分钟视频，再看中文讲解
        steps:
          - 把一版阻塞调用改成虚拟线程
          - 同样限流配置下压测对比
          - 写结论：什么条件才值得切
        practice: 一份对比数据
        check:
          - 有吞吐与资源数据
          - 结论有边界
        pitfall: 以为用了虚拟线程就不用限流，反而把下游打挂。

  - day: W14D02
    tasks:
      - i: 0
        why: 用最少的钱跑出可接受的效果，是工程能力。
        refs: [v-kvcache-promptcache]
        focus: 成本与缓存那部分
        steps:
          - 设计路由规则：简单/长文档/需推理
          - 用评测集跑三种策略，对比准确率与成本
          - 画成本-质量曲线
        practice: 曲线 + 选型结论
        check:
          - 有对比数据
          - 有拐点判断
        pitfall: 省下的钱不值得多写的复杂度，要算总账。

  - day: W14D03
    tasks:
      - i: 0
        why: 建立「什么时候不该微调」的判断力，比会微调更值钱。
        refs: [v-llm-agent-skill]
        focus: 看 LLM 到 Agent 的能力边界
        steps:
          - 整理判断树：不知道/格式风格/推理能力
          - 列 3 个该微调与 3 个不该微调的场景
          - 估算一次 LoRA 的成本与验证方式
        practice: 判断树 + 成本估算
        check:
          - 判断树可执行
          - 有成本数字
        pitfall: 效果不好先想微调，其实问题在检索和 Prompt。

  - day: W14D04
    tasks:
      - i: 0
        why: 真实失败才是最值钱的测试集。
        refs: [v-rag-eval-interview]
        focus: 12 分钟，看 badcase 如何变成用例
        steps:
          - 设计反馈入口（赞/踩 + 一句话原因）
          - 把 badcase 自动转成 eval 用例
          - 跑一次「新增用例→修复→回归」闭环
        practice: 反馈回流链路
        check:
          - 能新增用例
          - 能回归验证
        pitfall: 只收集不回流，badcase 永远是 badcase。

  - day: W14D05
    tasks:
      - i: 0
        why: 公网暴露就会被扫，限额是第一道防线。
        refs: [v-docker-sgg]
        focus: 只看部署与编排那几节
        steps:
          - 部署到云主机或免费平台
          - 配限流、额度上限、错误页
          - 生成可分享链接
        practice: 一个能点开的地址
        check:
          - 外网可访问
          - 额度有上限
        pitfall: 演示环境复用生产密钥，被人刷爆。

  - day: W14D06
    tasks:
      - i: 0
        why: 三版介绍对应三种场景，临时组织来不及。
        refs: []
        steps:
          - 简历定稿，项目放最前，量化指标加粗
          - 准备 30 秒 / 3 分钟 / 10 分钟三版介绍
          - 找 3 个目标岗位投递或约聊
        practice: 简历 + 三版介绍 + 投递记录
        check:
          - 三版都能脱稿
          - 有投递动作
        pitfall: 只写简历不练口述，面试现场讲不清取舍。

  - day: W14D07
    tasks:
      - i: 0
        why: 结束这一轮，才知道下一轮做什么。
        refs: []
        steps:
          - 统计总投入、完成率、可展示成果
          - 写能力自评雷达（工程/应用/RAG/Agent/工程化/表达）
          - 定下一个 8 周方向
        practice: 一份总复盘 + 能力雷达
        check:
          - 有量化
          - 下阶段有目标
        pitfall: 只写感受，下一轮从零开始想。
