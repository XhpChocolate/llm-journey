# 资源库：所有链接集中在这里维护。
# 链接失效时只改这一处，计划文件（weeks/*.yaml）用 id 引用，不会散落。
#
# 字段说明
#   id      唯一标识，天计划里用 refs: [id] 引用
#   title   资源名
#   url     链接
#   type    doc | video | code | tool
#   lang    zh | en
#   minutes 建议投入分钟数（单次阅读/观看）
#   must    true=当天主资源（先用它），false=补充/查询型
#   after   看完后应该能回答的问题（验收标准，比「看完」有用）
#   note    使用提示
#
# 视频类说明：直接指向具体视频的链接半年内大概率失效，因此视频条目使用
# 「平台搜索页」作为入口，并标注筛选标准。文档类为官方稳定地址。

resources:
  # ---------- LLM / API 认知 ----------
  - id: r-deepseek-docs
    title: DeepSeek API 文档（总览）
    url: https://api-docs.deepseek.com/
